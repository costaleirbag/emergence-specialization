# Hysteresis scaffold: locality changes at explicit round boundaries.
experiment:
  num_agents: 4
  num_rounds: 80
  checkpoints: {every: 10}
  seed: 1
feedback:
  mode: probabilistic
  private_probability: 0.2
  schedule: [[20, 0.4], [40, 0.6], [60, 0.8]]
condition:
  memory_mode: private
agent:
  backend: mock
logging:
  output_dir: data/research_runs
  probe_set_path: data/probe_set.json
