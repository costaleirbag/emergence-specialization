# PopulationState scaffold only; not executable by the fixed-N runner yet.
experiment:
  num_agents: 4
  num_rounds: 80
  checkpoints: {every: 10}
  seed: 1
condition:
  memory_mode: private
interventions:
  - trigger_round: 41
    operation: replace_agent
    source_agent: agent_0
    replacement_agent: agent_replacement_41
agent:
  backend: mock
logging:
  output_dir: data/research_runs
  probe_set_path: data/probe_set.json
